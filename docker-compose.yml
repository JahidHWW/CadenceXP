services:
  database:
    image: postgres:17
    container_name: cadencexp-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - cadencexp-postgres-data:/var/lib/postgresql/data

volumes:
  cadencexp-postgres-data:
